<!DOCTYPE html>
<html>
<head>
    <title>車禍即時偵測與串流系統</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1e1e1e; color: #fff; margin-top: 30px; }
        .control-panel { background: #2d2d2d; padding: 20px; border-radius: 10px; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { padding: 10px 18px; font-size: 15px; margin: 5px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 5px; transition: 0.2s; }
        button:hover { background: #005999; }
        .link-box { margin-top: 15px; background: #333; padding: 10px; border-radius: 5px; display: inline-block; }
        a { color: #4da6ff; font-weight: bold; text-decoration: none; }
        img { border: 4px solid #444; border-radius: 8px; max-width: 100%; height: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h1>YOLOv8 即時車禍偵測與串流平台</h1>
    
    <div class="control-panel">
        <p><b>影像來源控制：</b></p>
        <button onclick="changeSource('test.mp4')">播放測試影片</button>
        <button onclick="changeSource('0')">電腦鏡頭</button>
        <button onclick="changeSource('mobile')">手機鏡頭串流</button>
        
        
    </div>

    <div>
        <img id="streamView" src="/video_feed?source=test.mp4" width="640" height="480">
    </div>

    <script>
        const host = window.location.host;
        document.getElementById('mobileLink').href = "https://" + host + "/mobile";
        document.getElementById('mobileLink').innerText = "https://" + host + "/mobile";

        function changeSource(src) {
            const img = document.getElementById('streamView');
            img.src = '/video_feed?source=' + encodeURIComponent(src);
        }
    </script>
</body>
</html>
